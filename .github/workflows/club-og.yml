name: Club-deelafbeeldingen

# Dagelijks de share images van de clubpagina's verversen (vorm, stand, volgende wedstrijd).
# Alleen clubs waarvan de gegevens veranderd zijn worden opnieuw gemaakt en in Webflow bijgewerkt.
# Niet op het hele uur: GitHub laat geplande runs op :00 vaak vallen.
on:
  schedule:
    - cron: "41 5 * * *"     # ochtend (na de nachtelijke uitslagen)
    - cron: "41 22 * * *"    # avond (na de wedstrijden van de dag)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: club-og
  cancel-in-progress: false

jobs:
  club-og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pillow
      - name: Club-afbeeldingen bijwerken
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python club_og.py
      - name: State bewaren
        run: |
          git config user.name "club-og-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/club_og.json || true
          git diff --cached --quiet && exit 0
          git commit -m "state: club-og [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && exit 0; sleep 3; done
