name: Genereer live-kijken-artikelen (3 dagen vooruit + tv-update)

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC (~20:00 NL) — nieuwe artikelen voor morgen t/m over 3 dagen + tv-update morgen
    - cron: "30 7 * * *"   # 07:30 UTC (~09:30 NL) — tv-update voor vandaag (de tv-gids kijkt 2-3 dagen vooruit)
  workflow_dispatch:
    inputs:
      date:
        description: "Datum (YYYY-MM-DD), leeg = morgen"
        required: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pillow (deelafbeeldingen)
        run: pip install -q pillow
      - name: Genereer + publiceer
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python generate.py --date "${{ github.event.inputs.date }}"
          elif [ "$(date -u +%H)" -lt 12 ]; then
            # ochtend: alleen zender/aanbieder van vandaag bijwerken als de tv-gids iets anders zegt
            python generate.py --date "$(date -u +%F)" --update --alleen-tv-wijziging
          else
            # avond: artikelen zo vroeg mogelijk online (meer tijd om in Google te komen)
            for d in 1 2 3; do python generate.py --date "$(date -u -d "+$d day" +%F)"; done
            python generate.py --date "$(date -u -d '+1 day' +%F)" --update --alleen-tv-wijziging
          fi
      - name: Commit state (fixture-id -> item-id)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/live-kijken.json og/*.webp || true
          git commit -m "state: live-kijken artikelen" || echo "geen wijzigingen"
          git push || echo "niets te pushen"
      - name: Deelafbeeldingen koppelen (na push, raw-URL moet bestaan)
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: |
          python attach_og.py
          git add state/live-kijken.json || true
          git commit -m "state: deelafbeeldingen gekoppeld" || echo "geen wijzigingen"
          git push || echo "niets te pushen"
