name: Genereer live-kijken-artikelen (avond ervoor + tv-update)

on:
  schedule:
    - cron: "13 17 * * *"  # 17:13 UTC (~19:15 NL) — nieuwe artikelen voor morgen (±24 uur voor de aftrap) + tv-update morgen
    - cron: "30 7 * * *"   # 07:30 UTC (~09:30 NL) — tv-update voor vandaag (de tv-gids kijkt 2-3 dagen vooruit)
  workflow_dispatch:
    inputs:
      date:
        description: "Datum (YYYY-MM-DD), leeg = morgen"
        required: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pillow (deelafbeeldingen)
        run: pip install -q pillow
      - name: Genereer + publiceer
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python generate.py --date "${{ github.event.inputs.date }}"
          elif [ "${{ github.event.schedule }}" = "30 7 * * *" ]; then
            # (op de cron zelf sturen, niet op het uur: GitHub start geplande runs soms uren te laat)
            # ochtend: alleen zender/aanbieder van vandaag bijwerken als de tv-gids iets anders zegt
            python generate.py --date "$(date -u +%F)" --update --alleen-tv-wijziging
          else
            # avond: alleen morgen (±24 uur vooruit). 3 dagen vooruit leverde amper kliks op: de artikelen
            # waren bij de aftrap al 'oud' en zakten in Google (gebruiker, 12 okt 2026)
            # 'morgen' t.o.v. de geplande dag: ook goed als de run pas na middernacht start
            MORGEN=$(date -u -d "@$(( $(date +%s) - 43200 + 86400 ))" +%F)
            python generate.py --date "$MORGEN"
            python generate.py --date "$MORGEN" --update --alleen-tv-wijziging
          fi
          # speelronde-hubs per competitie (alleen bijwerken als zender/links veranderd zijn)
          python speelronde.py || echo "speelronde-hubs mislukt"
          python zenders_hub.py || echo "zenders-hub mislukt"
          python zender_schema.py || echo "zender-schema mislukt"
      - name: Commit state (fixture-id -> item-id)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/live-kijken.json state/zenders_hub.json data/zender_schema.json og/*.webp || true
          git commit -m "state: live-kijken artikelen" || echo "geen wijzigingen"
          git push || echo "niets te pushen"
      - name: Deelafbeeldingen koppelen (na push, raw-URL moet bestaan)
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: |
          python attach_og.py
          git add state/live-kijken.json || true
          git commit -m "state: deelafbeeldingen gekoppeld" || echo "geen wijzigingen"
          git push || echo "niets te pushen"
